name: Deploy Website to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8D13CACB462543A38FAA3004A8C6D5D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2C647AB98231401D9A4F20D3F0461064 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_58EB5436DB9C477593D416BE36CF9A27 }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: absastore
          package: .
          